services:
  # Home Assistant service
  home-assistant:
    image: ghcr.io/home-assistant/home-assistant:latest
    container_name: home-assistant
    restart: unless-stopped
    privileged: true
    environment:
      - TZ=Europe/Brussels
    volumes:
      - ./config:/config:Z
      - /run/dbus:/run/dbus:ro
    ports:
      - "8123:8123"
    networks:
      - home-network
    depends_on:
      - scanner

  scanner:
    build:
      context: ..
      dockerfile: client/Dockerfile
    container_name: client
    restart: unless-stopped
    environment:
      - TZ=Europe/Brussels
    volumes:
      - ..:/app:Z
    devices:
      - /dev/video0:/dev/video0
    networks:
      - home-network
    ports:
      - "8080:8080"

networks:
  home-network:
    driver: bridge
